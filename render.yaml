# Render Blueprint: one web service (API + embedded workers) and one Postgres database.
# Check Render's current free-tier limits before relying on this for a long-lived demo.
databases:
  - name: queueforge-db
    plan: free

services:
  - type: web
    name: queueforge
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueforge-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: EMBEDDED_WORKERS
        value: "true"
      - key: WORKER_THREADS
        value: "2"
