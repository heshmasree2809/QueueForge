services:
  - type: web
    name: queueforge
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: EMBEDDED_WORKERS
        value: "true"
      - key: WORKER_THREADS
        value: "2"
      - key: POOL_SIZE
        value: "5"
