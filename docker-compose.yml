services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      EMBEDDED_WORKERS: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://queue:queue@db:5432/queue
      WORKER_THREADS: "5"
    depends_on:
      db:
        condition: service_healthy
